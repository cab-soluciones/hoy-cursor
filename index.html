<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Hoy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Hoy: rutina diaria, gimnasio, tareas, gastos y notas en un solo sitio.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hoy">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="flameOut" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0b6fb0"/><stop offset=".5" stop-color="#38c7ff"/><stop offset="1" stop-color="#d9f6ff"/></linearGradient>
      <linearGradient id="flameIn" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7be3ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    </defs>
  </svg>
  <main id="app">
    <section class="view" id="view-hoy" aria-label="Hoy"></section>
    <section class="view" id="view-gym" aria-label="Gym" hidden></section>
    <section class="view" id="view-actividad" aria-label="Actividad" hidden></section>
    <section class="view" id="view-gastos" aria-label="Gastos" hidden></section>
    <section class="view" id="view-notas" aria-label="Notas" hidden></section>
    <section class="view" id="view-ajustes" aria-label="Ajustes" hidden></section>
  </main>

  <button class="fab" id="fab" type="button" aria-label="Añadir" hidden>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div class="rest-bar" id="rest-bar" role="timer" aria-live="off" hidden>
    <div class="rest-fill" id="rest-fill"></div>
    <div class="rest-body">
      <div class="rest-info"><span id="rest-label">Descanso</span><b id="rest-time">00:00</b></div>
      <div class="rest-btns">
        <button type="button" data-action="gym:rest-add" data-s="-15">−15</button>
        <button type="button" data-action="gym:rest-add" data-s="15">+15</button>
        <button type="button" class="skip" data-action="gym:rest-skip">Saltar</button>
      </div>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Secciones">
    <button type="button" class="tab active" data-tab="hoy"><span class="ico" data-icon="sun"></span><span>Hoy</span></button>
    <button type="button" class="tab" data-tab="gym"><span class="ico" data-icon="dumbbell"></span><span>Gym</span></button>
    <button type="button" class="tab" data-tab="actividad"><span class="ico" data-icon="walk"></span><span>Actividad</span></button>
    <button type="button" class="tab" data-tab="gastos"><span class="ico" data-icon="wallet"></span><span>Gastos</span></button>
    <button type="button" class="tab" data-tab="notas"><span class="ico" data-icon="note"></span><span>Notas</span></button>
    <button type="button" class="tab" data-tab="ajustes"><span class="ico" data-icon="sliders"></span><span>Ajustes</span></button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="grabber"></div>
    <div class="sheet-head">
      <button type="button" class="link" id="sheet-cancel">Cancelar</button>
      <h2 id="sheet-title"></h2>
      <button type="button" class="link strong" id="sheet-save">Guardar</button>
    </div>
    <form id="sheet-form" autocomplete="off" novalidate></form>
    <button type="button" class="danger-btn" id="sheet-delete" hidden>Eliminar</button>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script type="module" src="js/main.js"></script>
</body>
</html>
