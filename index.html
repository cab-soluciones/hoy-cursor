<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Hoy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Hoy: tareas, hábitos, gastos y notas en un solo sitio.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hoy">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section class="view" id="view-hoy" data-view="hoy" aria-label="Hoy"></section>
    <section class="view" id="view-gastos" data-view="gastos" aria-label="Gastos" hidden></section>
    <section class="view" id="view-notas" data-view="notas" aria-label="Notas" hidden></section>
    <section class="view" id="view-ajustes" data-view="ajustes" aria-label="Ajustes" hidden></section>
  </main>

  <button class="fab" id="fab" type="button" aria-label="Añadir" hidden>+</button>

  <nav class="tabbar" id="tabbar" aria-label="Secciones">
    <button type="button" class="tab active" data-tab="hoy"><span class="ico">☀️</span><span>Hoy</span></button>
    <button type="button" class="tab" data-tab="gastos"><span class="ico">💶</span><span>Gastos</span></button>
    <button type="button" class="tab" data-tab="notas"><span class="ico">📝</span><span>Notas</span></button>
    <button type="button" class="tab" data-tab="ajustes"><span class="ico">⚙️</span><span>Ajustes</span></button>
  </nav>

  <div class="backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="grabber"></div>
    <div class="sheet-head">
      <button type="button" class="link" id="sheet-cancel">Cancelar</button>
      <h2 id="sheet-title"></h2>
      <button type="button" class="link strong" id="sheet-save">Guardar</button>
    </div>
    <form id="sheet-form" autocomplete="off"></form>
    <button type="button" class="danger-btn" id="sheet-delete" hidden>Eliminar</button>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script src="app.js"></script>
</body>
</html>
